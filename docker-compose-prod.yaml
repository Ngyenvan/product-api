services:

  mongodb:

    image: mongo:8.0

    container_name: namongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_prod_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  product-api:

    image: ${DOCKERHUB_USERNAME}/product-api:latest

    container_name: product-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000

      MONGO_URI: mongodb://mongodb:27017/productdb

    depends_on:

      mongodb:
        condition: service_healthy

    healthcheck:

      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:

  mongo_prod_data:
