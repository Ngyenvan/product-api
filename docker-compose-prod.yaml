services:

  mongodb:

    image: mongo:8.0

    container_name: nammongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_prod_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "if (db.adminCommand('ping').ok !== 1) { quit(1) }"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  product-api:

    image: ${DOCKERHUB_USERNAME}/product-api:${PRODUCT_IMAGE_TAG:-latest}

    container_name: product-api

    ports:
      - "3000:3000"

    environment:

      PORT: 3000

      MONGO_URI: mongodb://mongodb:27017/productdb


    depends_on:

      mongodb:

        condition: service_healthy


    healthcheck:

      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:

  mongo_prod_data: