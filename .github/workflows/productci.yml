name: Product API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:

      mongodb:
        image: mongo:8.0

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/productdb_test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD tests
        run: npm test


  build-and-push:

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}


  deploy-local:

    needs: build-and-push

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login Docker Hub
        shell: powershell
        run: |
          "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull latest image
        shell: powershell
        run: |
          $env:DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

          docker compose -f docker-compose-prod.yaml pull

      - name: Deploy Product API
        shell: powershell
        run: |
          $env:DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

          docker compose -f docker-compose-prod.yaml up -d --remove-orphans

      - name: Check containers
        shell: powershell
        run: |
          $env:DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

          docker compose -f docker-compose-prod.yaml ps
