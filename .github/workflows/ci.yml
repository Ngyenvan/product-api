name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8.0
          until docker exec mongodb mongosh --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1; do
            echo "Waiting for MongoDB to be ready..."
            sleep 1
          done
          echo "MongoDB is ready!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/productdb
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: npm test
