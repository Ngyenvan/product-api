name: Product API CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          touch .env
          echo "PORT=3000" >> .env
          echo "MONGO_URI=mongodb://nammongodb:27017/productdb" >> .env
          echo "TEST_MONGO_URI=mongodb://nammongodb:27017/productdb" >> .env

      - name: Run Docker Compose
        run: docker compose up -d --build

      - name: Print container logs on error
        if: failure()
        run: docker compose logs

      - name: Run test suite inside API container
        run: docker compose exec -T product-api npm test

      - name: Cleanup
        if: always()
        run: docker compose down -v
